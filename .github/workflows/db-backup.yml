name: Database Backup

on:
  # Jadwal harian DINONAKTIFKAN sementara (2026-10-08) sampai secret DATABASE_URL
  # diisi di GitHub repo settings. Tanpa secret, run otomatis gagal tiap hari.
  # Untuk mengaktifkan lagi: hapus komentar blok schedule di bawah.
  # schedule:
  #   # Setiap hari jam 02:00 WIB (UTC+7) = 19:00 UTC
  #   - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Alasan backup manual"
        required: false
        default: "manual trigger"

jobs:
  backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Connection string Supabase (session pooler). Set di:
      # Settings > Secrets and variables > Actions > New repository secret
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Guard — pastikan secret sudah diisi
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL belum diset di repository settings."
            exit 1
          fi

      - name: Install PostgreSQL client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Test DB connection
        run: psql "$DATABASE_URL" -c "SELECT 'Connection OK' AS status;"

      - name: Create backup
        run: |
          FILENAME="backup_si4care_$(date +%Y%m%d_%H%M%S).sql.gz"
          echo "BACKUP_FILE=$FILENAME" >> $GITHUB_ENV

          pg_dump "$DATABASE_URL" --no-owner --no-acl | gzip > "$FILENAME"

          echo "Backup size: $(du -sh $FILENAME | cut -f1)"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      # Opsional: upload ke Backblaze B2 atau S3-compatible storage
      # Uncomment dan isi B2_BUCKET_NAME + B2_APPLICATION_KEY_ID + B2_APPLICATION_KEY secret
      # - name: Upload to B2 Cloud Storage
      #   uses: jakejarvis/s3-sync-action@master
      #   with:
      #     args: --acl private
      #   env:
      #     AWS_S3_BUCKET: ${{ secrets.B2_BUCKET_NAME }}
      #     AWS_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      #     AWS_REGION: "us-east-005"
      #     AWS_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      #     SOURCE_DIR: "."
      #     DEST_DIR: "backups/si4care/"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Backup GAGAL pada $(date). Periksa secret DATABASE_URL."
